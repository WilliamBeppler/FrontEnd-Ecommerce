<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra</title>
    <link rel="stylesheet" href="/styles/style.css"> <!-- Puxando o seu CSS -->
</head>
<body>

    <header>
        <h1 style="text-align: center; margin-top: 20px; color: #2c3e50;">Finalizar Compra</h1>
    </header>

    <main class="checkout-container">
        
        <!-- LADO ESQUERDO: Dados de Entrega e Pagamento -->
        <section class="checkout-form-section">
            
            <h2>Endereço de Entrega</h2>
            <form id="form-checkout">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                
                <div class="input-group">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" placeholder="Nome da rua" required>
                </div>

                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123" required>
                </div>

                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" required>
                </div>

                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" required>
                </div>

                <div class="input-group">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" placeholder="Ex: SC" maxlength="2" required>
                </div>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

                <h2>Método de Pagamento</h2>
                <div class="opcoes-pagamento">
                    <label>
                        <input type="radio" name="pagamento" value="PIX" checked>
                        PIX
                    </label>
                    <label>
                        <input type="radio" name="pagamento" value="CARTAO_CREDITO">
                        Cartão de Crédito
                    </label>
                </div>

                <!-- Div do Cartão de Crédito (Escondida por padrão) -->
                <div id="dados-cartao" class="dados-cartao-container" style="display: none;">
                    <div class="input-group">
                        <label for="numero-cartao">Número do Cartão</label>
                        <input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" maxlength="19">
                    </div>
                    
                    <div class="input-group">
                        <label for="nome-cartao">Nome Impresso no Cartão</label>
                        <input type="text" id="nome-cartao" placeholder="Ex: João da Silva">
                    </div>
                    
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex: 1;">
                            <label for="validade-cartao">Validade</label>
                            <input type="text" id="validade-cartao" placeholder="MM/AA" maxlength="5">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label for="cvv-cartao">CVV</label>
                            <input type="text" id="cvv-cartao" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>

            </form>
        </section>

        <!-- LADO DIREITO: Resumo do Pedido -->
        <aside class="checkout-resumo-section">
            <h2>Resumo do Pedido</h2>
            
            <!-- Os itens serão injetados aqui pelo JavaScript -->
            <div id="lista-resumo-itens">
                <p>Carregando itens...</p>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
            
            <div class="resumo-total">
                <h3>Total a Pagar:</h3>
                <h3 id="valor-total-checkout">R$ 0,00</h3>
            </div>

            <!-- Botão Gigante de Finalizar -->
            <button id="btn-finalizar-compra" class="btn-principal">Confirmar e Pagar</button>
        </aside>

    </main>

 <script src="../js/auth.js"></script>
 <script src="../js/checkout.js"></script>
   
</body>
</html>
